# Kitchen Sink: one screen for each thing OpenSwiftUI's Linux host shows (Renderer/GTK/KitchenSink
# in the OpenSwiftUI fork), written in SwiftUI. A plain app: the compositor starts it and it
# opens a GTK 4 window of its own, with no host service and no account. build-app.sh in the
# fork's Renderer/GTK/polkadot-os puts the program next to this file. The phone needs the
# Alpine packages gtk4.0 and libstdc++.
format=1
id=swiftui-kitchen-sink
name=Kitchen Sink
icon=icon.svg
run=exec
program=kitchen-sink
